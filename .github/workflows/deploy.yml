# Déploiement continu : frontend → Cloudflare Pages
# Déclenché sur chaque push sur main.
# Secrets requis dans GitHub Actions :
#   CF_API_TOKEN   : token Cloudflare avec permission "Cloudflare Pages : Edit"
#   CF_ACCOUNT_ID  : ton Account ID Cloudflare (visible sur le dashboard)

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=youfundthat --commit-dirty=true
